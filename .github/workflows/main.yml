name: Bot Supercuotas

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run-bot:
    runs-on:  self-hosted

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright aiohttp
          python -m playwright install chromium

      - name: Ejecutar bot
        run: python bot.py 
